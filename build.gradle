plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = '2.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'software.amazon.awssdk:s3:2.25.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'org.json:json:20231013'
    implementation 'com.formdev:flatlaf:3.5.1'
    implementation 'com.formdev:flatlaf-extras:3.5.1'
    implementation 'com.github.weisj:jsvg:1.4.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.nicholasburczyk.packupdater.Main'
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName = 'PackUpdater.jar'
    mergeServiceFiles()
    manifest {
        attributes(
                'Main-Class': application.mainClass,
                'Implementation-Title': 'GroidPack Updater',
                'Implementation-Version': project.version,
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

def macSetupText = '''GroidPack Updater - macOS first launch
======================================

You need Java 17 or newer installed. Check by opening Terminal and running:

    java -version

If that fails, install it from https://adoptium.net (pick the .pkg for your Mac).

FOLDER ICON (optional)
----------------------
To give this folder the GroidPack icon: select the folder in Finder, press
Command-I, click the small icon at the top left of the info window, then drag
folder.icns onto it.

TO LAUNCH
---------
Double-click PackUpdater.jar

The FIRST time only, macOS will likely say the file "cannot be opened because it
is from an unidentified developer". That is Gatekeeper, not a broken download.

    Right-click (or Control-click) PackUpdater.jar, then choose Open,
    then click Open again in the dialog.

macOS remembers this, so every launch after the first is a normal double-click.

IF DOUBLE-CLICKING DOES NOTHING
-------------------------------
Some Macs do not associate .jar files with Java. Use the launcher instead:

    Double-click "Launch PackUpdater.command"

IF YOU GET A PERMISSION ERROR
-----------------------------
Open Terminal, type "cd " (with the space), drag this folder into the Terminal
window, press Return, then run these two lines:

    xattr -dr com.apple.quarantine .
    chmod +x "Launch PackUpdater.command"
'''

def winSetupText = '''GroidPack Updater - Windows first launch
=======================================

You need Java 17 or newer installed. Check by opening Command Prompt and running:

    java -version

If that fails, install it from https://adoptium.net (pick the .msi).

TO LAUNCH
---------
Double-click PackUpdater.jar

FOLDER ICON (optional)
----------------------
Double-click "Apply folder icon.bat" once to give this folder the GroidPack icon.

IF DOUBLE-CLICKING OPENS THE WRONG PROGRAM
------------------------------------------
Windows sometimes associates .jar with an archive tool. Use the launcher instead:

    Double-click "Launch PackUpdater.bat"
'''

tasks.register('createLaunchers') {
    dependsOn shadowJar
    group = 'distribution'
    description = 'Builds the macOS and Windows distribution zips.'

    doLast {
        def jarFile = shadowJar.archiveFile.get().asFile
        def launchersDir = file("${buildDir}/launchers")
        delete launchersDir
        launchersDir.mkdirs()

        def iconDir = 'src/main/resources/com/nicholasburczyk/packupdater/images'

        def macDir = new File(launchersDir, 'GroidPack Updater-MacOS')
        macDir.mkdirs()
        copy {
            from jarFile
            into macDir
        }
        copy {
            from "${iconDir}/folder.icns"
            into macDir
        }
        new File(macDir, 'Launch PackUpdater.command').text =
                '#!/bin/bash\ncd "$(dirname "$0")"\nexec java -jar PackUpdater.jar\n'
        new File(macDir, 'FIRST-TIME-SETUP.txt').text = macSetupText

        ant.zip(destfile: new File(launchersDir, 'GroidPack Updater-MacOS.zip')) {
            zipfileset(dir: macDir, includes: '*.command', filemode: '755',
                    prefix: 'GroidPack Updater-MacOS')
            zipfileset(dir: macDir, excludes: '*.command',
                    prefix: 'GroidPack Updater-MacOS')
        }

        def winDir = new File(launchersDir, 'GroidPack Updater-Windows')
        winDir.mkdirs()
        copy {
            from jarFile
            into winDir
        }
        copy {
            from "${iconDir}/folder.ico"
            into winDir
        }
        new File(winDir, 'Launch PackUpdater.bat').text =
                '@echo off\r\ncd /d "%~dp0"\r\njava -jar PackUpdater.jar\r\nif errorlevel 1 pause\r\n'
        new File(winDir, 'FIRST-TIME-SETUP.txt').text = winSetupText

        new File(winDir, 'desktop.ini').text =
                '[.ShellClassInfo]\r\nIconResource=folder.ico,0\r\nIconFile=folder.ico\r\n' +
                        'IconIndex=0\r\nInfoTip=Double-click PackUpdater.jar to launch\r\n'

        new File(winDir, 'Apply folder icon.bat').text = [
                '@echo off',
                'setlocal',
                'set "FOLDER=%~dp0"',
                'if "%FOLDER:~-1%"=="\\" set "FOLDER=%FOLDER:~0,-1%"',
                'attrib +h +s "%FOLDER%\\desktop.ini"',
                'attrib +s "%FOLDER%"',
                'ie4uinit.exe -show',
                'echo Folder icon applied to "%FOLDER%".',
                'echo If it has not changed yet, press F5 in Explorer.',
                'pause'
        ].join('\r\n') + '\r\n'

        ant.zip(destfile: new File(launchersDir, 'GroidPack Updater-Windows.zip')) {
            zipfileset(dir: winDir, prefix: 'GroidPack Updater-Windows')
        }

        logger.lifecycle("Distribution zips written to ${launchersDir}")
    }
}

